name: SDK Rust Release

# Triggered by `sdk-rust-vX.Y.Z` tags. Bumps Cargo.toml version,
# runs tests, publishes to crates.io. Skips silently if CRATES_IO_TOKEN
# isn't configured.

on:
  push:
    tags: ['sdk-rust-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish chakramcp (crates.io)
    runs-on: ubuntu-22.04
    # Same fix as sdk-ts-release: the job-level `env:` block isn't
    # evaluated before job-level `if:`, so the original gate read
    # CRATES_TOKEN_SET as undefined→false. Replaced with an inline
    # check in the publish step.
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
          key: sdk-rust-release

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="${GITHUB_REF_NAME#sdk-rust-v}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Bump Cargo.toml version
        run: |
          ver="${{ steps.v.outputs.version }}"
          sed -i.bak -E "0,/^version = \".*\"/{s//version = \"${ver}\"/}" Cargo.toml
          rm -f Cargo.toml.bak
          grep '^version' Cargo.toml

      - name: Test
        run: cargo test --all-targets

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            # Per the workflow docstring: silently skip crates.io publish
            # when the token isn't configured. We've never published the
            # Rust SDK to crates.io — the GitHub tag + release notes are
            # the canonical release, consumers fetch via git ref.
            echo "::notice::CRATES_IO_TOKEN not configured; skipping crates.io publish (tag-only release)."
            exit 0
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
