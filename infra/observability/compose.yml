# The observability stack — Prometheus (metrics), Loki (logs), Alloy (the
# collector) and Grafana (dashboards and alerts). Designs:
# docs/superpowers/specs/2026-09-29-observability-phase1-design.md and
# 2026-09-29-self-hosting-phase2-design.md; guide: docs/self-hosting/.
#
# An overlay on ../docker-compose.prod.yml: it only ADDS services and
# volumes, and uses the `internal` and `observability` networks that file
# declares. Run it with both files, from the project directory
# (/opt/chakramcp on the VM, where the base file is docker-compose.yml; a
# checkout's infra/, where it is docker-compose.prod.yml), through
# scripts/deploy.sh, which checks the host first and applies config changes.
#
# Needs a systemd Linux host logging to journald (LOG_DRIVER=journald, the
# default) with persistent journal storage: Alloy reads container logs from
# the host journal. Docker Desktop can't run it.
#
# Relative paths below resolve against that project directory. Nothing here
# depends_on a base service, so bringing the stack up or down never touches
# the relay, Postgres, Redis or Caddy.
#
# Env (the project's .env; see ../.env.example): GRAFANA_ADMIN_PASSWORD and
# PG_MONITOR_PASSWORD are required. Sign-in providers (GRAFANA_GITHUB_*,
# GRAFANA_GOOGLE_*, GRAFANA_OIDC_*, GRAFANA_ROLE_ATTRIBUTE_PATH), the alert
# channel (ALERT_CHANNEL and its settings) and HTTPS probes (PROBE_TARGETS)
# are optional: by default Grafana has only its admin login, and alerts show
# in Grafana alone.

# Same logging as the base services: the host journal, never blocking.
# (YAML anchors don't carry across compose files.)
x-logging: &logging
  driver: ${LOG_DRIVER:-journald}
  options:
    mode: non-blocking
    max-buffer-size: 4m
    labels: com.docker.compose.service

services:
  # The only collector. Deliberately unprivileged: no Docker socket, no host
  # filesystem beyond the journal (read-only), every capability dropped.
  # uid 0 without capabilities can still read the journal because root owns
  # those files; nothing else from the host is mounted. (Its data lives at
  # /alloy-data, a root-owned volume: without capabilities, root can't enter
  # the image's own /var/lib/alloy, which belongs to the `alloy` user.)
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    logging: *logging
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/alloy-data
      - --server.http.listen-addr=0.0.0.0:12345
    user: "0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 150MiB
      PG_MONITOR_PASSWORD: ${PG_MONITOR_PASSWORD:?set PG_MONITOR_PASSWORD in .env}
      # HTTPS probes, a JSON list: [{"name":"relay","address":"https://…/healthz"}].
      PROBE_TARGETS: ${PROBE_TARGETS:-[]}
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      - alloy_data:/alloy-data
      # The host journal. Strict mounts: on a host without them, Compose
      # fails instead of creating /etc/machine-id as a directory, or
      # creating /var/log/journal, which would switch journald to
      # persistent storage. /run/log/journal is tmpfs on systemd hosts.
      - type: bind
        source: /var/log/journal
        target: /var/log/journal
        read_only: true
        bind: { create_host_path: false }
      - /run/log/journal:/run/log/journal:ro
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
        bind: { create_host_path: false }
    networks: [internal, observability]

  # Stores and queries metrics; Alloy remote-writes into it.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
      # POST /-/reload, so CD applies config changes without a restart.
      - --web.enable-lifecycle
      - --log.level=warn
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 200MiB
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5

  # Stores logs (14 days).
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/loki.yml"]
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 150MiB
    volumes:
      - ./observability/loki:/etc/loki:ro
      - loki_data:/loki
    networks: [observability]

  # Dashboards and alerting. The only piece reachable from outside, through
  # Caddy at GRAFANA_DOMAIN. Sign-in: the admin login form by default, plus
  # GitHub, Google or a generic OIDC provider when configured; each provider
  # admits only whom GRAFANA_ROLE_ATTRIBUTE_PATH maps to a role (strict).
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    logging: *logging
    depends_on: [prometheus, loki]
    # Grafana 13 needs ~250 MB of heap plus ~120 MB of its mapped binary in
    # prod (it sat at a 384 MB cap, evicting its own code pages).
    # GOMEMLIMIT keeps the heap in check but must stay above the live heap,
    # or GC spins.
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 256MiB
      GF_LOG_LEVEL: warn
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-localhost}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # true once a provider works: the admin then signs in only from inside
      # the host (Caddy refuses Basic auth from outside).
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Sign-in providers, each off unless enabled. Every one is strict: a
      # user GRAFANA_ROLE_ATTRIBUTE_PATH doesn't map to a role is refused,
      # so an empty path refuses everyone.
      GF_AUTH_GITHUB_ENABLED: ${GRAFANA_GITHUB_ENABLED:-false}
      GF_AUTH_GITHUB_CLIENT_ID: ${GRAFANA_GITHUB_CLIENT_ID:-}
      GF_AUTH_GITHUB_CLIENT_SECRET: ${GRAFANA_GITHUB_CLIENT_SECRET:-}
      # read:org is required: at every sign-in Grafana lists the user's team
      # memberships (/user/teams), which 404s without it and fails the login.
      GF_AUTH_GITHUB_SCOPES: "user:email,read:org"
      GF_AUTH_GITHUB_ALLOW_SIGN_UP: "true"
      GF_AUTH_GITHUB_AUTO_LOGIN: ${GRAFANA_GITHUB_AUTO_LOGIN:-false}
      GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH: ${GRAFANA_ROLE_ATTRIBUTE_PATH:-}
      GF_AUTH_GITHUB_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GITHUB_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GOOGLE_ENABLED: ${GRAFANA_GOOGLE_ENABLED:-false}
      GF_AUTH_GOOGLE_CLIENT_ID: ${GRAFANA_GOOGLE_CLIENT_ID:-}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${GRAFANA_GOOGLE_CLIENT_SECRET:-}
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: "true"
      GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_PATH: ${GRAFANA_ROLE_ATTRIBUTE_PATH:-}
      GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GOOGLE_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OIDC_NAME:-OpenID Connect}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OIDC_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OIDC_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OIDC_API_URL:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GRAFANA_OIDC_SCOPES:-openid email profile}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: ${GRAFANA_ROLE_ATTRIBUTE_PATH:-}
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # false in CI: rules load but never try to notify.
      GF_UNIFIED_ALERTING_EXECUTE_ALERTS: ${GF_UNIFIED_ALERTING_EXECUTE_ALERTS:-true}
      # Alert channel settings, read by grafana/channels/$ALERT_CHANNEL.yml
      # (Grafana expands $VARS in contact-point settings).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Outgoing mail, for the email channel.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-localhost:25}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-admin@grafana.localhost}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      # The alert channel (none, telegram, slack, email or webhook), mounted
      # over the placeholder provisioning/alerting/channel.yml. Strict, so an
      # unknown ALERT_CHANNEL fails here rather than mounting a directory.
      - type: bind
        source: ./observability/grafana/channels/${ALERT_CHANNEL:-none}.yml
        target: /etc/grafana/provisioning/alerting/channel.yml
        read_only: true
        bind: { create_host_path: false }
      - grafana_data:/var/lib/grafana
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  alloy_data:
  prometheus_data:
  loki_data:
  grafana_data:
