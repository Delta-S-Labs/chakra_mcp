name: CLI CI

on:
  push:
    branches: [main]
    paths:
      - "backend/cli/**"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - ".github/workflows/cli-ci.yml"
  # Always run on PRs so required-status checks always post.
  # Otherwise PRs that don't touch backend/cli/ get stuck on
  # "expected — waiting" forever (branch-protection trap).
  pull_request:
    branches: [main]

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # macos-14 hosted-image workaround. Some image revs ship a
      # `/usr/local/bin/cargo` that is actually `rustup-init`, so
      # `cargo build` errors out with "unexpected argument 'build'".
      # PATH prepending alone has proven flaky between steps (the
      # rerun on PR #57 hit the shim even after the prepend), so we
      # also *delete* the stale shim. After this step the only
      # `cargo` on PATH is `~/.cargo/bin/cargo` from the toolchain
      # the previous step installed. No-op on healthy images / on
      # platforms that don't have the shim.
      - name: Ensure cargo on PATH (macos-14 rustup-init shim workaround)
        shell: bash
        run: |
          set -e
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # Nuke the shim. `command -v cargo` returns the first match
          # on PATH; if that's not ~/.cargo/bin/cargo, it's the shim.
          if [ "$(command -v cargo)" != "$HOME/.cargo/bin/cargo" ]; then
            shim="$(command -v cargo || true)"
            if [ -n "$shim" ] && [ "$shim" != "$HOME/.cargo/bin/cargo" ]; then
              echo "Removing stale cargo shim at $shim"
              sudo rm -f "$shim" || rm -f "$shim" || true
            fi
            shim_rustc="$(command -v rustc || true)"
            if [ -n "$shim_rustc" ] && [ "$shim_rustc" != "$HOME/.cargo/bin/rustc" ]; then
              echo "Removing stale rustc shim at $shim_rustc"
              sudo rm -f "$shim_rustc" || rm -f "$shim_rustc" || true
            fi
          fi
          rustup default stable 2>/dev/null || true
          rustup target add "${{ matrix.target }}" 2>/dev/null || true
          # Use the absolute path so this verification can't be fooled
          # by PATH not propagating to the next step.
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: cli-${{ matrix.target }}

      # CLI doesn't pull in chakramcp-shared / sqlx, so the build needs no
      # DATABASE_URL even though the rest of the workspace does.
      - name: Build CLI
        run: cargo build -p chakramcp-cli --target ${{ matrix.target }}

      - name: Clippy (CLI)
        run: cargo clippy -p chakramcp-cli --target ${{ matrix.target }} -- -D warnings

      - name: Format
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt -p chakramcp-cli --check
