# Fixed UIDs: dashboards and alert rules reference these, so the JSON is
# portable (Phase 2 reuses it unchanged).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # A traced request's JSON log lines carry its trace_id: a link to the
      # trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w{32})"'
          datasourceUid: tempo
          url: "$${__value.raw}"

  # Traces, when the relay sends them (OTEL_EXPORTER_OTLP_ENDPOINT). A span
  # links to its request's log lines in Loki.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service="relay"} |= "$${__trace.traceId}"'

  # The relay's own database, for the Revenue dashboard: Prometheus keeps
  # 15 days, revenue needs months. Read-only, as the collector's
  # chakramcp_monitor login, which may read only the credit columns
  # scripts/ensure-monitor-role.sh grants (no emails), for 5 s per query.
  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: pg:5432
    user: chakramcp_monitor
    editable: false
    jsonData:
      database: chakramcp
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 2
      maxIdleConns: 1
    secureJsonData:
      password: $PG_MONITOR_PASSWORD
