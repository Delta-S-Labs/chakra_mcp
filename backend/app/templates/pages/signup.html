{% extends "pages/base.html" %}
{% block content %}
<h1>Create an account</h1>
{% if let Some(error) = error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/signup">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="return_to" value="{{ return_to }}">
  <label>Name <input name="name" value="{{ name }}" autocomplete="name" required autofocus></label>
  <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="username" required></label>
  <label>Password <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="200" required></label>
  <button type="submit">Create account</button>
</form>
{% if let Some(href) = signin_href %}<p class="aside">Already have an account? <a href="{{ href }}">Sign in</a></p>{% endif %}
{% endblock %}
