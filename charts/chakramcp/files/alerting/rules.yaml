# Generated by infra/observability/scripts/sync-chart-assets.sh from
# infra/observability/grafana/provisioning/alerting/rules.yml. Edit the source, then re-run the script.
apiVersion: 1
groups:
- orgId: 1
  name: availability
  folder: ChakraMCP
  interval: 1m
  rules:
  - uid: backend-down
    title: Backend down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (check) (label_replace(1 - probe_success{job=~"integrations/blackbox/(relay|app)"}, "check", "$1", "job", "integrations/blackbox/(.*)") or label_replace(1 - up{job="chakramcp"}, "check", "metrics scrape", "", ""))
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Error
    for: 2m
    annotations:
      summary: '{{ $labels.check }} is failing (HTTPS probe from the VM, or the metrics scrape).'
    labels:
      severity: critical
    isPaused: false
  - uid: high-5xx-ratio
    title: High 5xx ratio
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(rate(chakramcp_http_requests_total{status=~"5.."}[5m])) / sum(rate(chakramcp_http_requests_total[5m])) and on() sum(rate(chakramcp_http_requests_total[5m])) > 0.1
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.05
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: More than 5% of requests are failing with 5xx{{ with $values.A }} ({{ humanizePercentage .Value }}){{ end }}.
    labels:
      severity: critical
    isPaused: false
- orgId: 1
  name: credits
  folder: ChakraMCP
  interval: 1m
  rules:
  - uid: credit-switches-stale
    title: Credit switches stale
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: clamp_min(max((timestamp(chakramcp_credits_switches_last_refresh_timestamp_seconds) - chakramcp_credits_switches_last_refresh_timestamp_seconds) - on(instance, job) chakramcp_credits_stale_after_seconds), 0) + max(chakramcp_credits_switches_stale)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Error
    for: 2m
    annotations:
      summary: 'The credit switches are stale: nobody is blocked (fail open) until a refresh succeeds.'
    labels:
      severity: critical
    isPaused: false
  - uid: credit-queue-backlog
    title: Credit queue backlog
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(chakramcp_credits_queue_depth)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5000
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: '{{ with $values.A }}{{ humanize .Value }} c{{ else }}C{{ end }}redit charges are queued; the worker is falling behind.'
    labels:
      severity: warning
    isPaused: false
