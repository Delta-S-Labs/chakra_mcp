# `ct install`: the bundled observability stack (without volumes, to keep
# CI light). Its helm test checks that the server is scraped, its logs reach
# Loki, a request's trace reaches Tempo, and Grafana has the dashboards and
# alert rules.
image:
  pullPolicy: IfNotPresent
observability:
  bundled:
    enabled: true
postgresql:
  persistence:
    enabled: false
prometheus:
  server:
    persistentVolume:
      enabled: false
loki:
  singleBinary:
    persistence:
      enabled: false
grafana:
  persistence:
    enabled: false
# Tempo's root filesystem is read-only: /var/tempo is an emptyDir instead.
tempo:
  persistence:
    enabled: false
  tempo:
    extraVolumeMounts:
      - name: tempo-data
        mountPath: /var/tempo
  extraVolumes:
    - name: tempo-data
      emptyDir: {}
