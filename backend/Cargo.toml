[workspace]
resolver = "2"
members = [
  "shared",
  "app",
  "relay",
  "cli",
  "server",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Web
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "json"] }

# IDs / time
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth / crypto
# jsonwebtoken 10 removed the implicit crypto-backend default (which
# used to be ring). Now you must either enable `rust_crypto` /
# `aws_lc_rs` as a feature OR call `CryptoProvider::install_default()`
# at process start. Pick the pure-Rust backend — no build-time C deps
# (cmake/Go), smaller binary, adequate for JWT-sign/verify volume.
# Without this flag every encode/decode panics with "Could not
# automatically determine the process-level CryptoProvider".
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
hmac = "0.12"
sha2 = "0.11"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
password-hash = "0.6"
# Ed25519 for Agent Card signing (JWS). `rand_core` matches rand 0.8.
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Config / errors / logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
