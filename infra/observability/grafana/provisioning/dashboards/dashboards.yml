# Dashboards come from the repo (grafana/dashboards/*.json) and are reloaded
# from disk on their own; edits in the UI aren't kept — change the JSON.
apiVersion: 1

providers:
  - name: chakramcp
    folder: ChakraMCP
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
