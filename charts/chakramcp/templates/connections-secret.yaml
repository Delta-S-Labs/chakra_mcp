{{- $db := include "chakramcp.externalDatabaseFromValues" . }}
{{- $redis := include "chakramcp.externalRedisFromValues" . }}
{{- if or $db $redis }}
# External connection URLs given as values; they may carry passwords, so
# they reach the server from here rather than from the pod spec.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chakramcp.connectionsSecretName" . }}
  labels:
    {{- include "chakramcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $db }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- if $redis }}
  REDIS_URL: {{ .Values.externalRedis.url | quote }}
  {{- end }}
{{- end }}
