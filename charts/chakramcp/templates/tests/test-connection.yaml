{{- $fullname := include "chakramcp.fullname" . }}
# `helm test`: the server answers, reaches Postgres, and exports metrics.
# Runs the server's own image, which has wget.
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test
  labels:
    {{- include "chakramcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      image: "{{ .Values.image.repository }}:{{ include "chakramcp.imageTag" . }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - sh
        - -ec
        - |
          base=http://{{ $fullname }}
          wget -qO- "$base:{{ .Values.service.relayPort }}/healthz"; echo
          wget -qO- "$base:{{ .Values.service.relayPort }}/readyz"; echo
          wget -qO- "$base:{{ .Values.service.appPort }}/healthz"; echo
          # The server's own sign-in page is served: a request naming no
          # client gets its 400 error page, not a 404.
          status=$(wget -S -O /dev/null "$base:{{ .Values.service.appPort }}/oauth/authorize" 2>&1 | awk '/HTTP\//{print $2; exit}')
          echo "sign-in page: $status"
          [ "$status" = 400 ]
          {{- if .Values.metrics.enabled }}
          wget -qO- "$base:{{ .Values.metrics.port }}/metrics" | grep '^chakramcp_build_info'
          {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
