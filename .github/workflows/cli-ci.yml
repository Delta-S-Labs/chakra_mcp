name: CLI CI

on:
  push:
    branches: [main]
    paths:
      - "backend/cli/**"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - ".github/workflows/cli-ci.yml"
  # Always run on PRs so required-status checks always post.
  # Otherwise PRs that don't touch backend/cli/ get stuck on
  # "expected — waiting" forever (branch-protection trap).
  pull_request:
    branches: [main]

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # macos-14 hosted-image workaround. Some image revs ship a
      # `/usr/local/bin/cargo` that is actually `rustup-init`, so
      # plain `cargo build` errors out with "unexpected argument
      # 'build'". We've tried two approaches that both proved flaky
      # across reruns:
      #
      #   1. (PR #45) prepend `$HOME/.cargo/bin` to PATH via
      #      `$GITHUB_PATH`. Sometimes another step's shell-rc
      #      reordering displaced it.
      #   2. (PR #57) actively delete the shim with `rm`. Didn't
      #      fire here because `command -v cargo` inside the
      #      workaround step returned the right binary, but the
      #      NEXT step's PATH resolution still hit the shim.
      #
      # Final approach (#58): bypass PATH entirely. Export `CARGO`
      # and `RUSTC` as absolute paths into `$GITHUB_ENV` and have
      # every cargo invocation below use `$CARGO` / `$RUSTC`. The
      # binary that runs is fully decided by us, not by whatever
      # the shell's PATH happens to be at step time.
      - name: Pin cargo/rustc to absolute paths (macos-14 shim bypass)
        shell: bash
        run: |
          set -e
          CARGO_BIN="$HOME/.cargo/bin/cargo"
          RUSTC_BIN="$HOME/.cargo/bin/rustc"
          if [ ! -x "$CARGO_BIN" ]; then
            # Fall back to whatever the system has (Windows path,
            # custom installs). PATH-resolved, but on platforms
            # that don't have the macos-14 shim problem.
            CARGO_BIN="$(command -v cargo)"
            RUSTC_BIN="$(command -v rustc)"
          fi
          echo "CARGO=$CARGO_BIN" >> "$GITHUB_ENV"
          echo "RUSTC=$RUSTC_BIN" >> "$GITHUB_ENV"
          # Also prepend ~/.cargo/bin to PATH so any tooling that
          # spawns `cargo` itself (Swatinem/rust-cache, ...) finds
          # the right binary.
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup default stable 2>/dev/null || true
          rustup target add "${{ matrix.target }}" 2>/dev/null || true
          "$CARGO_BIN" --version
          "$RUSTC_BIN" --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: cli-${{ matrix.target }}

      # CLI doesn't pull in chakramcp-shared / sqlx, so the build needs no
      # DATABASE_URL even though the rest of the workspace does.
      - name: Build CLI
        run: $CARGO build -p chakramcp-cli --target ${{ matrix.target }}
        shell: bash

      - name: Clippy (CLI)
        run: $CARGO clippy -p chakramcp-cli --target ${{ matrix.target }} -- -D warnings
        shell: bash

      - name: Format
        if: matrix.os == 'ubuntu-22.04'
        run: $CARGO fmt -p chakramcp-cli --check
        shell: bash
