name: CLI Release

# Triggered by pushing a tag of the form `cli-vX.Y.Z`. Cuts a GitHub
# Release with cross-compiled binaries for mac (arm + intel), linux
# (x64 + arm64), and windows (x64), then optionally updates the
# Homebrew tap and publishes the npm wrapper.
#
# Manual trigger (`workflow_dispatch`) is supported for re-runs;
# provide the version (e.g. `0.1.0`) and the workflow will operate as
# if the tag `cli-v<version>` had been pushed.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

permissions:
  contents: write   # needs write to create the release

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="${GITHUB_REF_NAME#cli-v}"
          fi
          if [ -z "$ver" ]; then
            echo "::error::could not resolve version"
            exit 1
          fi
          echo "version=$ver"            >> "$GITHUB_OUTPUT"
          echo "tag=cli-v$ver"           >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            ext: ""
            archive: tar.gz
          # macos-13 hosted runners have been phased out / depth=infinite
          # (cli-v0.1.0 sat queued >25min with no runner assignment).
          # Cross-compile x86_64-apple-darwin from a macos-14 (arm64)
          # runner instead — the Rust toolchain action already adds the
          # x86_64-apple-darwin target via `targets: ${{ matrix.target }}`,
          # and both Mac targets share the same Mac SDK.
          - target: x86_64-apple-darwin
            runner: macos-14
            ext: ""
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            ext: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            ext: ""
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            ext: ".exe"
            archive: zip

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # macos-14 hosted-image workaround. Some image revs ship a
      # `/usr/local/bin/cargo` that is actually `rustup-init`, so
      # plain `cargo build` errors out with "unexpected argument
      # 'build'". Two earlier approaches both proved flaky across
      # reruns:
      #
      #   1. (PR #45) prepend `$HOME/.cargo/bin` to PATH via
      #      `$GITHUB_PATH`. Sometimes another step's shell-rc
      #      reordering displaced it.
      #   2. (PR #57) actively `rm` the shim. The detection inside
      #      the workaround step itself returned the right binary,
      #      so the rm branch never fired — but the NEXT step still
      #      hit the shim.
      #
      # Final approach (#58, mirrored here): bypass PATH entirely.
      # Export `CARGO` and `RUSTC` as absolute paths into
      # `$GITHUB_ENV` and have every cargo invocation below use
      # `$CARGO` / `$RUSTC`. The binary that runs is fully decided
      # by us, not by whatever the shell's PATH happens to be at
      # step time. Identical to the cli-ci.yml workaround — keep
      # them in sync.
      - name: Pin cargo/rustc to absolute paths (macos-14 shim bypass)
        shell: bash
        run: |
          set -e
          CARGO_BIN="$HOME/.cargo/bin/cargo"
          RUSTC_BIN="$HOME/.cargo/bin/rustc"
          if [ ! -x "$CARGO_BIN" ]; then
            # Fall back to whatever the system has (Windows path,
            # custom installs). PATH-resolved, but on platforms
            # that don't have the macos-14 shim problem.
            CARGO_BIN="$(command -v cargo)"
            RUSTC_BIN="$(command -v rustc)"
          fi
          echo "CARGO=$CARGO_BIN" >> "$GITHUB_ENV"
          echo "RUSTC=$RUSTC_BIN" >> "$GITHUB_ENV"
          # Also prepend ~/.cargo/bin to PATH so any tooling that
          # spawns `cargo` itself (Swatinem/rust-cache, ...) finds
          # the right binary.
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup default stable 2>/dev/null || true
          rustup target add "${{ matrix.target }}" 2>/dev/null || true
          "$CARGO_BIN" --version
          "$RUSTC_BIN" --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: cli-release-${{ matrix.target }}

      - name: Build CLI (release)
        working-directory: backend
        shell: bash
        run: $CARGO build -p chakramcp-cli --release --target ${{ matrix.target }}

      # Server binary is unix-only (depends on postgresql via brew on
      # mac/linux; no equivalent brew-services story on Windows).
      - name: Build server (unix only)
        if: matrix.archive == 'tar.gz'
        working-directory: backend
        shell: bash
        env:
          # The server binary's compile uses sqlx::query! macros via
          # chakramcp-app — those are checked at compile time against
          # a live DATABASE_URL OR an offline cache. We use offline.
          SQLX_OFFLINE: "true"
        run: $CARGO build -p chakramcp-server --release --target ${{ matrix.target }}

      - name: Package (unix tarballs — CLI + server)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -e
          ver="${{ needs.resolve-version.outputs.version }}"
          tgt="${{ matrix.target }}"
          mkdir -p dist staging-cli staging-server

          # CLI
          cp "backend/target/${tgt}/release/chakramcp" "staging-cli/chakramcp"
          chmod +x staging-cli/chakramcp
          name="chakramcp-${ver}-${tgt}"
          tar -czf "dist/${name}.tar.gz" -C staging-cli chakramcp
          shasum -a 256 "dist/${name}.tar.gz" | awk '{print $1}' > "dist/${name}.tar.gz.sha256"

          # Server
          cp "backend/target/${tgt}/release/chakramcp-server" "staging-server/chakramcp-server"
          chmod +x staging-server/chakramcp-server
          sname="chakramcp-server-${ver}-${tgt}"
          tar -czf "dist/${sname}.tar.gz" -C staging-server chakramcp-server
          shasum -a 256 "dist/${sname}.tar.gz" | awk '{print $1}' > "dist/${sname}.tar.gz.sha256"

      - name: Package (windows zip — CLI only)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          $tgt = "${{ matrix.target }}"
          $name = "chakramcp-$ver-$tgt"
          New-Item -ItemType Directory -Path dist, staging | Out-Null
          Copy-Item "backend/target/$tgt/release/chakramcp.exe" "staging/chakramcp.exe"
          Compress-Archive -Path "staging/chakramcp.exe" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.zip.sha256" -Value $hash -NoNewline

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [resolve-version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.resolve-version.outputs.version }}"
          tag="${{ needs.resolve-version.outputs.tag }}"
          # Tolerate re-runs on an existing tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "CLI ${ver}" \
              --generate-notes
          fi

  homebrew:
    name: Update Homebrew formula
    needs: [resolve-version, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Render formulas
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p Formula

          # CLI formula — sha256s come from the chakramcp-* tarballs.
          cli_sha() { cat "dist/chakramcp-${VERSION}-$1.tar.gz.sha256"; }
          sed \
            -e "s|@VERSION@|${VERSION}|g" \
            -e "s|@TAG@|${TAG}|g" \
            -e "s|@OWNER_REPO@|${OWNER_REPO}|g" \
            -e "s|@MAC_ARM_SHA@|$(cli_sha aarch64-apple-darwin)|g" \
            -e "s|@MAC_X64_SHA@|$(cli_sha x86_64-apple-darwin)|g" \
            -e "s|@LINUX_X64_SHA@|$(cli_sha x86_64-unknown-linux-gnu)|g" \
            -e "s|@LINUX_ARM_SHA@|$(cli_sha aarch64-unknown-linux-gnu)|g" \
            packaging/cli/homebrew/chakramcp.rb.template > Formula/chakramcp.rb

          # Server formula — sha256s come from the chakramcp-server-* tarballs.
          srv_sha() { cat "dist/chakramcp-server-${VERSION}-$1.tar.gz.sha256"; }
          sed \
            -e "s|@VERSION@|${VERSION}|g" \
            -e "s|@TAG@|${TAG}|g" \
            -e "s|@OWNER_REPO@|${OWNER_REPO}|g" \
            -e "s|@MAC_ARM_SHA@|$(srv_sha aarch64-apple-darwin)|g" \
            -e "s|@MAC_X64_SHA@|$(srv_sha x86_64-apple-darwin)|g" \
            -e "s|@LINUX_X64_SHA@|$(srv_sha x86_64-unknown-linux-gnu)|g" \
            -e "s|@LINUX_ARM_SHA@|$(srv_sha aarch64-unknown-linux-gnu)|g" \
            packaging/server/homebrew/chakramcp-server.rb.template > Formula/chakramcp-server.rb

          echo "── Formula/chakramcp.rb ──"
          cat Formula/chakramcp.rb
          echo "── Formula/chakramcp-server.rb ──"
          cat Formula/chakramcp-server.rb

      - name: Open PR with formula bumps
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -e
          git config user.name  'chakramcp-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          # Stage the rendered files first. `git diff -- Formula/` (no
          # `--cached`) does NOT see untracked paths, so on the *first*
          # release — when `Formula/` doesn't exist on main — the diff
          # check incorrectly reports "nothing to do" and the step
          # exits without opening a PR. Caught on cli-v0.1.0 (the
          # release succeeded otherwise; the formula PR just never
          # opened, and the docs claimed `brew install chakramcp`
          # would work).
          git add Formula/chakramcp.rb Formula/chakramcp-server.rb
          if git diff --cached --quiet -- Formula/; then
            echo "Formulas already up to date for ${VERSION}; nothing to do."
            exit 0
          fi
          branch="release-bot/homebrew-${VERSION}"
          git checkout -b "$branch"
          git add Formula/chakramcp.rb Formula/chakramcp-server.rb
          git commit -m "chakramcp ${VERSION} (cli + server)"
          git push -u origin "$branch" --force-with-lease
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already open for $branch."
          else
            gh pr create \
              --title "chakramcp ${VERSION} (cli + server)" \
              --body "Auto-generated by .github/workflows/cli-release.yml after the cli-v${VERSION} release." \
              --base main \
              --head "$branch"
          fi

  npm:
    name: Publish npm wrapper
    needs: [resolve-version, release]
    runs-on: ubuntu-22.04
    # Job-level `env:` isn't evaluated before job-level `if:`, so the
    # earlier `env.NPM_TOKEN_SET == 'true'` gate always read as false
    # and GitHub flagged the run as a workflow file issue. Moved the
    # token check into the publish step instead — fails clearly if
    # the secret is missing.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Bump version
        working-directory: packaging/cli/npm
        run: |
          ver="${{ needs.resolve-version.outputs.version }}"
          npm version "$ver" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: packaging/cli/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty. Set it in repo secrets and re-run."
            exit 1
          fi
          npm publish --access public
