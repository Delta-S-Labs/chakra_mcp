{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "chakramcp.postgresql.secretName" . }}
# The generated Postgres password, kept across upgrades and after
# `helm uninstall`: the data volume outlives the release, and a new
# password wouldn't open it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chakramcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.postgresql.auth.secretKey }}: {{ include "chakramcp.keptRandom" (list . $name .Values.postgresql.auth.secretKey 32) }}
{{- end }}
