# Loki, single binary on the local filesystem: every container's logs for
# 14 days. Sized for a small VM (see the cache limits below).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-09-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h # 14 days, enforced by the compactor
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 1000
  allow_structured_metadata: true
  volume_enabled: true
  # Streams are labelled `service` (and `level`) by the collector; don't add
  # a duplicate `service_name` label.
  discover_service_name: []

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

analytics:
  reporting_enabled: false
