# Generated by infra/observability/scripts/sync-chart-assets.sh from
# infra/observability/grafana/provisioning/alerting/rules.yml. Edit the source, then re-run the script.
apiVersion: 1
groups:
- orgId: 1
  name: logs
  folder: ChakraMCP
  interval: 1m
  rules:
  - uid: error-log-spike
    title: Error-log spike
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum(count_over_time({service="relay", level="error"}[5m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 20
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: The relay logged{{ with $values.A }} {{ humanize .Value }}{{ else }} many{{ end }} errors in 5 minutes.
    labels:
      severity: warning
    isPaused: false
