[package]
name = "chakramcp-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chakramcp-relay"
path = "src/main.rs"

[dependencies]
chakramcp-shared = { path = "../shared" }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
reqwest = { workspace = true }
url = "2"
bytes = "1"
deadpool-redis = "0.23"
# Direct redis dep only to enable the `script` feature (atomic INCR+EXPIRE
# rate-limit window); cargo unifies it with deadpool-redis's redis 1.5.
redis = { version = "1", default-features = false, features = ["script"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
