# ChakraMCP on one host: production (the Lightsail VM, where CD copies this
# file to /opt/chakramcp/docker-compose.yml) and self-hosters run the same
# file. Everything specific to a deployment lives in .env next to it: copy
# .env.example and fill it in. Self-hosting guide: docs/self-hosting/.
#
#   caddy   → TLS termination + reverse proxy (ports 80/443 → relay/app)
#   relay   → chakramcp-server, exposes :8080 (app) + :8090 (relay), and
#             Prometheus metrics on :9464 (internal only — never published)
#   pg      → Postgres 16 with persistent volume
#   redis   → rate-limit counters (no persistence)
#
# Every service logs through Docker's journald driver by default (see
# x-logging), so journald handles rotation and the observability stack
# (infra/observability/) reads container logs from the journal. On a host
# without journald (Docker Desktop), set LOG_DRIVER=json-file: the services
# run, but the observability stack needs journald.
#
# The image defaults to the public ghcr.io/delta-s-labs/chakramcp-server:latest,
# the newest release (`:edge` follows main).
# Production sets CHAKRAMCP_IMAGE to its private ECR image, and CD overrides
# it per deploy with the build's exact `:<sha>` tag for both `migrate` and
# `relay`, so a deploy never runs a stale `:latest`.
#
# First start (migrations also run when the relay boots):
#   docker compose -f docker-compose.prod.yml up -d
#
# Upgrades:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

# Container logs → the host journal. non-blocking: if the log pipeline ever
# stalls, lines are dropped rather than blocking a container's stdout (so
# logging can never slow the relay). The compose service name is attached
# to every entry as COM_DOCKER_COMPOSE_SERVICE.
x-logging: &logging
  driver: ${LOG_DRIVER:-journald}
  options:
    mode: non-blocking
    max-buffer-size: 4m
    labels: com.docker.compose.service

services:
  pg:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: chakramcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chakramcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chakramcp -d chakramcp"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  # Ephemeral store for per-account rate-limit counters (fixed 60s windows).
  # No persistence — the counters are throwaway and refill every minute; the
  # relay fails open if this is unreachable. Bounded memory with LRU eviction
  # as a safety net (keys are short-TTL so it should never fill).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  # One-shot migration runner (CD runs it before restarting the relay):
  #   docker compose --profile migrate run --rm migrate
  # Won't start under `docker compose up` because of the profile.
  # chakramcp-server validates JWT_SECRET even for the `migrate`
  # subcommand, so it has to be present.
  migrate:
    profiles: ["migrate"]
    image: ${CHAKRAMCP_IMAGE:-ghcr.io/delta-s-labs/chakramcp-server:latest}
    logging: *logging
    depends_on:
      pg: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://chakramcp:${POSTGRES_PASSWORD}@pg:5432/chakramcp
      JWT_SECRET: ${JWT_SECRET}
    command: ["migrate"]
    networks: [internal]

  relay:
    image: ${CHAKRAMCP_IMAGE:-ghcr.io/delta-s-labs/chakramcp-server:latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://chakramcp:${POSTGRES_PASSWORD}@pg:5432/chakramcp
      REDIS_URL: redis://redis:6379
      # self_hosted (the default) or managed (chakramcp.com only). Self-hosted
      # means credits off, public sign-up closed and ADMIN_EMAIL ignored: the
      # operator creates accounts with `chakramcp-server users`. Empty values
      # mean the server's defaults. See docs/self-hosting/compose.md.
      HOSTING_MODE: ${HOSTING_MODE:-}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-}
      CREDITS_ENABLED: ${CREDITS_ENABLED:-}
      # The amounts default to the server's own defaults, written out: images
      # before 0.3.0 refuse to start on an empty value here.
      CREDITS_DEFAULT_MONTHLY_FREE_MC: ${CREDITS_DEFAULT_MONTHLY_FREE_MC:-5000000}
      CREDITS_COST_PER_INVOCATION_MC: ${CREDITS_COST_PER_INVOCATION_MC:-100}
      CREDITS_COST_PER_MESSAGE_MC: ${CREDITS_COST_PER_MESSAGE_MC:-100}
      LIMITS_DEFAULT_RATE_PER_MIN: ${LIMITS_DEFAULT_RATE_PER_MIN:-60}
      # Empty means the server's default (100 credits, at least the cost of a
      # call). Older images don't read it, so empty is safe for them.
      CREDITS_LOW_BALANCE_MC: ${CREDITS_LOW_BALANCE_MC:-}
      # Usage-limit enforcement. Default true = ENFORCING: over-limit calls are
      # denied (429: over the per-minute rate limit, or, with credits on, out
      # of credits). To fall back to shadow mode (log `limit.would_block`,
      # still serve), set LIMITS_ENFORCE=false in .env. Takes effect on the
      # next `docker compose up -d relay` (which also starts Redis — until it's
      # up, rate limiting fails open; the credit switches don't use Redis).
      LIMITS_ENFORCE: ${LIMITS_ENFORCE:-true}
      # System One compliance checks (TypeSafe Jev) — off unless the host env
      # sets SYSTEM_ONE_CHECKS=true and TYPESAFE_AI_KEY. Fail-open: a TypeSafe
      # outage never blocks calls. See docs/system-one-compliance.md.
      SYSTEM_ONE_CHECKS: ${SYSTEM_ONE_CHECKS:-false}
      TYPESAFE_AI_KEY: ${TYPESAFE_AI_KEY:-}
      TYPESAFE_AI_MODEL: ${TYPESAFE_AI_MODEL:-jev-latest}
      # Message safety screening (needs the checks above): harmful content
      # blocked, off-platform contact details redacted. Off until set.
      SYSTEM_ONE_SAFETY: ${SYSTEM_ONE_SAFETY:-false}
      # Calls: two-way sessions between agents. Off until set. The limits
      # default to the server's own defaults, written out.
      CALLS_ENABLED: ${CALLS_ENABLED:-false}
      CALLS_MAX_TTL_DAYS: ${CALLS_MAX_TTL_DAYS:-365}
      CALLS_DEFAULT_TTL_DAYS: ${CALLS_DEFAULT_TTL_DAYS:-30}
      CALLS_MAX_ACTIVE_PER_AGENT: ${CALLS_MAX_ACTIVE_PER_AGENT:-20}
      CALLS_MAX_MESSAGES: ${CALLS_MAX_MESSAGES:-2000}
      JWT_SECRET: ${JWT_SECRET}
      APP_PORT: "8080"
      RELAY_PORT: "8090"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL}
      # Where sign-in and device-pairing links point. A self-hosted server
      # serves those pages itself at APP_PUBLIC_URL; chakramcp.com points
      # this at its web UI.
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-${APP_PUBLIC_URL}}
      # chakramcp.com only. ADMIN_EMAIL: signing up with it grants admin
      # (managed mode). UPSERT_SHARED_SECRET: shared with the web UI's
      # server-side Google/GitHub sign-in callback; unset turns that off.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      UPSERT_SHARED_SECRET: ${UPSERT_SHARED_SECRET:-}
      # chakramcp.com only: buying credits through Dodo Payments (credits P4).
      # All four DODO_PAYMENTS_* or none (CD checks); empty means unset, and
      # a bad value turns purchasing off without stopping the server.
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_PAYMENTS_WEBHOOK_KEY: ${DODO_PAYMENTS_WEBHOOK_KEY:-}
      DODO_PAYMENTS_PRODUCT_ID: ${DODO_PAYMENTS_PRODUCT_ID:-}
      DODO_PAYMENTS_ENVIRONMENT: ${DODO_PAYMENTS_ENVIRONMENT:-}
      CREDITS_PURCHASE_PER_USD: ${CREDITS_PURCHASE_PER_USD:-}
      CREDITS_PURCHASE_MIN_CENTS: ${CREDITS_PURCHASE_MIN_CENTS:-}
      CREDITS_PURCHASE_MAX_CENTS: ${CREDITS_PURCHASE_MAX_CENTS:-}
      DISCOVERY_V2: "true"
      # chakramcp.com: the account whose agents (the house agents) the
      # directory features first. Empty features nobody.
      DISCOVERY_FEATURED_ACCOUNT: ${DISCOVERY_FEATURED_ACCOUNT:-}
      # Days of usage events (one per API request) to keep; 0 keeps them
      # forever. Empty means the server's default, 90. Older images ignore it.
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-}
      RUST_LOG: info,chakramcp_app=info,chakramcp_relay=info,sqlx=warn
      # One JSON object per log line (request_id, route, … on each), for Loki.
      LOG_FORMAT: json
      # Prometheus metrics for the observability stack's collector. Reachable
      # only on the Docker networks: not published, not routed by Caddy.
      METRICS_ADDR: "0.0.0.0:9464"
    networks: [internal]
    expose:
      - "8080"
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # chakramcp.com only: the house agents, Ping and the ChakraMCP Guide
  # (infra/house-agents/). Behind a profile, so `docker compose up -d` never
  # starts them; CD builds the image, ships it to the VM and starts it once
  # HOUSE_CHAKRAMCP_API_KEY and HOUSE_ANTHROPIC_API_KEY are in .env.
  house-agents:
    profiles: ["house-agents"]
    image: ${HOUSE_AGENTS_IMAGE:-chakramcp-house-agents:latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      relay: { condition: service_healthy }
    environment:
      HOUSE_CHAKRAMCP_API_KEY: ${HOUSE_CHAKRAMCP_API_KEY:-}
      HOUSE_ANTHROPIC_API_KEY: ${HOUSE_ANTHROPIC_API_KEY:-}
      # The org that owns the house agents (and DISCOVERY_FEATURED_ACCOUNT).
      HOUSE_ACCOUNT_SLUG: ${HOUSE_ACCOUNT_SLUG:-chakramcp}
      # What the Guide may spend on Claude per rolling 24 hours, in dollars.
      HOUSE_DAILY_BUDGET_USD: ${HOUSE_DAILY_BUDGET_USD:-10}
      # Comma-separated agent or account ids turned away by both agents.
      HOUSE_BLOCKED_AGENTS: ${HOUSE_BLOCKED_AGENTS:-}
      HOUSE_BLOCKED_ACCOUNTS: ${HOUSE_BLOCKED_ACCOUNTS:-}
      HOUSE_RELAY_URL: http://relay:8090
      HOUSE_APP_URL: http://relay:8080
    volumes:
      - house_agents_data:/data   # conversations + limit counters (SQLite)
    networks: [internal]
    mem_limit: 256m
    # A Guide answer can take up to two minutes; let it finish and post.
    stop_grace_period: 150s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      relay: { condition: service_healthy }
    # The Caddyfile's site addresses. Defaults live here, not in the
    # Caddyfile: Caddy's {$VAR:default} doesn't apply to a variable that is
    # set but empty. With GRAFANA_DOMAIN unset, Caddy serves that site as
    # localhost with its own local certificate, so nothing asks for a public
    # certificate while the observability stack is off.
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env (e.g. app.example.com)}
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env (e.g. relay.example.com)}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certs persisted here
      - caddy_config:/config
    # observability: so Caddy can front Grafana (infra/observability/).
    networks: [internal, observability]

networks:
  internal:
    driver: bridge
  # The observability stack's own network (Prometheus, Loki, Grafana,
  # Alloy). Declared here so Caddy's definition never changes when the
  # stack is added or removed.
  observability:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  house_agents_data:
