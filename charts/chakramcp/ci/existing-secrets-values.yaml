# `ct install`: every secret from Secrets chart-ci creates first, including
# a Postgres password full of URL-special characters (it reaches the server
# as PGPASSWORD, never inside a URL).
image:
  pullPolicy: IfNotPresent
secrets:
  existingSecret: chakramcp-ci-app
postgresql:
  auth:
    existingSecret: chakramcp-ci-postgres
  persistence:
    enabled: false
