apiVersion: v2
name: chakramcp
description: >-
  ChakraMCP, the relay and app API for agent networks, with optional bundled
  Postgres and Redis.
type: application
# The repo's copy installs the :edge image; each release (cli-release.yml)
# packages the chart with both versions set to the release, e.g. 0.2.0.
version: 0.0.0-dev
appVersion: edge
home: https://github.com/Delta-S-Labs/chakra_mcp
sources:
  - https://github.com/Delta-S-Labs/chakra_mcp
keywords: [mcp, agents, relay]
maintainers:
  - name: Delta S Labs
    url: https://github.com/Delta-S-Labs

# The bundled observability stack (observability.bundled.enabled), from
# each chart's current home. Chart.lock pins them; CI and the release run
# `helm dependency build` (after `helm repo add` for the two HTTP repos).
dependencies:
  - name: prometheus
    version: 29.35.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: observability.bundled.enabled
  - name: loki
    version: 18.13.7
    repository: oci://ghcr.io/grafana-community/helm-charts
    condition: observability.bundled.enabled
  - name: grafana
    version: 13.2.7
    repository: oci://ghcr.io/grafana-community/helm-charts
    condition: observability.bundled.enabled
  - name: alloy
    version: 1.13.0
    repository: https://grafana.github.io/helm-charts
    condition: observability.bundled.enabled
