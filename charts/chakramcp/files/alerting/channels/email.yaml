# Alerts go to Email: ALERT_EMAIL_TO (comma-separated), sent through the GF_SMTP_* server.
# Selected by ALERT_CHANNEL (compose mounts this file over
# provisioning/alerting/channel.yml). Each channel file deletes the other
# channels' contact points, because file provisioning never removes one on
# its own. Settings come from the container environment (the .env):
# Grafana expands $VARS in contact-point settings, not in rules or templates.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email-chakramcp
        type: email
        disableResolveMessage: false
        settings:
          addresses: "$ALERT_EMAIL_TO"
          singleEmail: true
          message: '{{ template "chakramcp.message" . }}'

policies:
  - orgId: 1
    receiver: email
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

deleteContactPoints:
  - orgId: 1
    uid: telegram-chakramcp
  - orgId: 1
    uid: slack-chakramcp
  - orgId: 1
    uid: webhook-chakramcp
