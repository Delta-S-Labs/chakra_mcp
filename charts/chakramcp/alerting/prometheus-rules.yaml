# The chart's alerts for Prometheus: the PrometheusRule's spec
# (templates/prometheusrule.yaml). The same four alerts Grafana gets from
# files/alerting/rules.yaml, which is generated from
# infra/observability/grafana/provisioning/alerting/rules.yml. Each alert's
# `uid` label names its Grafana twin, and sync-chart-assets.sh checks the two
# sets match. prometheus-rules.test.yaml pins the thresholds: change a
# threshold in both places.
groups:
  - name: chakramcp-availability
    rules:
      # Grafana's rule also alerts on no data; absent() does that here.
      - alert: ChakraMCPBackendDown
        expr: up{job="chakramcp"} == 0 or absent(up{job="chakramcp"})
        for: 2m
        labels:
          severity: critical
          uid: backend-down
        annotations:
          summary: The ChakraMCP server's metrics scrape is failing.
      - alert: ChakraMCPHigh5xxRatio
        expr: >-
          sum(rate(chakramcp_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(chakramcp_http_requests_total[5m])) > 0.05
          and on() sum(rate(chakramcp_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          uid: high-5xx-ratio
        annotations:
          summary: More than 5% of requests are failing with 5xx ({{ $value | humanizePercentage }}).
  - name: chakramcp-credits
    rules:
      # The worker refreshes the switches even with credits off, so the
      # metric always exists: its absence alerts, as in Grafana.
      - alert: ChakraMCPCreditSwitchesStale
        expr: >-
          clamp_min(max((timestamp(chakramcp_credits_switches_last_refresh_timestamp_seconds)
          - chakramcp_credits_switches_last_refresh_timestamp_seconds)
          - on(instance, job) chakramcp_credits_stale_after_seconds), 0)
          + max(chakramcp_credits_switches_stale) > 0
          or absent(chakramcp_credits_switches_last_refresh_timestamp_seconds)
        for: 2m
        labels:
          severity: critical
          uid: credit-switches-stale
        annotations:
          summary: "The credit switches are stale: nobody is blocked (fail open) until a refresh succeeds."
      - alert: ChakraMCPCreditQueueBacklog
        expr: max(chakramcp_credits_queue_depth) > 5000
        for: 15m
        labels:
          severity: warning
          uid: credit-queue-backlog
        annotations:
          summary: "{{ $value | humanize }} credit charges are queued; the worker is falling behind."
