{{- if not .Values.secrets.existingSecret }}
{{- $name := include "chakramcp.appSecretName" . }}
# The server's generated secrets, kept across upgrades and after
# `helm uninstall` (a reinstall reuses them, so sessions stay valid).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chakramcp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET: {{ include "chakramcp.keptRandom" (list . $name "JWT_SECRET" 64) }}
{{- end }}
