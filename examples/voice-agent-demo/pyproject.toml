[project]
name = "voice-agent-demo"
version = "0.1.0"
description = "Two-laptop voice-agent demo over ChakraMCP — friendship + dinner negotiation + Swiggy Dineout."
requires-python = ">=3.11"
dependencies = [
    # Reasoning loop + tracing + native MCP client.
    "openai-agents>=0.4.4",
    # HTTP — Sarvam STT/TTS, CLI-token read.
    "httpx>=0.27.0",
    # Audio I/O — push-to-talk.
    "sounddevice>=0.5.0",
    "numpy>=2.0",
    "scipy>=1.13",          # wav read/write for Sarvam round-trips
    # TUI.
    "textual>=0.83.0",
    # Env + CLI.
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    # CLI session file is TOML.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
voice-agent = "voice_agent_demo.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent_demo"]
