# Alerts go to A webhook: Grafana POSTs its alert JSON to ALERT_WEBHOOK_URL.
# Selected by ALERT_CHANNEL (compose mounts this file over
# provisioning/alerting/channel.yml). Each channel file deletes the other
# channels' contact points, because file provisioning never removes one on
# its own. Settings come from the container environment (the .env):
# Grafana expands $VARS in contact-point settings, not in rules or templates.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: webhook
    receivers:
      - uid: webhook-chakramcp
        type: webhook
        disableResolveMessage: false
        settings:
          url: "$ALERT_WEBHOOK_URL"
          httpMethod: POST

policies:
  - orgId: 1
    receiver: webhook
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

deleteContactPoints:
  - orgId: 1
    uid: telegram-chakramcp
  - orgId: 1
    uid: slack-chakramcp
  - orgId: 1
    uid: email-chakramcp
